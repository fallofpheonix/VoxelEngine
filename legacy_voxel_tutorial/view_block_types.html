<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Engine - Block Types</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; z-index: 100; }
    </style>
</head>
<body>
    <div id="info">Voxel Engine: Procedural Block Types (Stone, Dirt, Grass)</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const group = new THREE.Group();
        const size = 1;

        // Block Type Colors
        const colors = {
            stone: 0x888888,
            dirt: 0x8B4513,
            grass: 0x228B22
        };

        // Create a small landscape
        for (let x = -5; x < 5; x++) {
            for (let z = -5; z < 5; z++) {
                // Stone Layer (y=0)
                addBlock(x, 0, z, colors.stone);
                
                // Dirt Layer (y=1,2)
                addBlock(x, 1, z, colors.dirt);
                addBlock(x, 2, z, colors.dirt);
                
                // Grass Layer (y=3)
                addBlock(x, 3, z, colors.grass);
            }
        }

        function addBlock(x, y, z, color) {
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshPhongMaterial({ color: color, flatShading: true });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            group.add(cube);
        }

        scene.add(group);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.set(10, 8, 10);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            group.rotation.y += 0.003;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
