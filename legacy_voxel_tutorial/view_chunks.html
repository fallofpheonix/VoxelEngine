<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Engine - Chunks</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; z-index: 100; }
    </style>
</head>
<body>
    <div id="info">Voxel Engine: Chunk Organization (2x2x2 Chunks, each 8x8x8 blocks)</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const worldGroup = new THREE.Group();
        const CHUNK_COUNT = 2; // 2x2x2 grid of chunks
        const CHUNK_SIZE = 8;  // Visual scale 8x8x8 for clarity
        const BLOCK_SIZE = 1;

        for (let cx = 0; cx < CHUNK_COUNT; cx++) {
            for (let cy = 0; cy < CHUNK_COUNT; cy++) {
                for (let cz = 0; cz < CHUNK_COUNT; cz++) {
                    
                    const chunkGroup = new THREE.Group();
                    const chunkColor = new THREE.Color(`hsl(${(cx+cy+cz)*60}, 50%, 40%)`);
                    
                    // Create a wireframe for the chunk boundary
                    const boundaryGeom = new THREE.BoxGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_SIZE);
                    const boundaryWire = new THREE.WireframeGeometry(boundaryGeom);
                    const boundaryLine = new THREE.LineSegments(boundaryWire);
                    boundaryLine.material.color.setHex(0xffffff);
                    boundaryLine.material.opacity = 0.3;
                    boundaryLine.material.transparent = true;
                    
                    // Add a few sample blocks per chunk to show internal grouping
                    for(let i=0; i<3; i++) {
                        const bGeom = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                        const bMat = new THREE.MeshPhongMaterial({ color: chunkColor });
                        const block = new THREE.Mesh(bGeom, bMat);
                        block.position.set(
                            (Math.random() - 0.5) * (CHUNK_SIZE - 1),
                            (Math.random() - 0.5) * (CHUNK_SIZE - 1),
                            (Math.random() - 0.5) * (CHUNK_SIZE - 1)
                        );
                        chunkGroup.add(block);
                    }

                    chunkGroup.position.set(
                        cx * (CHUNK_SIZE + 2), 
                        cy * (CHUNK_SIZE + 2), 
                        cz * (CHUNK_SIZE + 2)
                    );
                    chunkGroup.add(boundaryLine);
                    worldGroup.add(chunkGroup);
                }
            }
        }

        scene.add(worldGroup);

        // Center view
        const box = new THREE.Box3().setFromObject(worldGroup);
        const center = box.getCenter(new THREE.Vector3());
        worldGroup.position.sub(center);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 10, 10).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.z = 30;

        function animate() {
            requestAnimationFrame(animate);
            worldGroup.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
